<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="960" viewBox="0 0 1480 960" role="img" aria-labelledby="title desc">
  <title id="title">ER-диаграмма базы данных EasyKeep</title>
  <desc id="desc">Шесть таблиц схемы dbo: categories, items, warehouses, stocks, movements, movement_items. Показаны первичные и внешние ключи, уникальные и CHECK-ограничения, связи один ко многим.</desc>

  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style>
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; }
      .header { fill: #2563EB; }
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #64748B; }
      .table-name { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .field { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; fill: #0F172A; }
      .type { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; fill: #475569; }
      .badge-text { font-family: "Segoe UI", Arial, sans-serif; font-size: 9.5px; font-weight: 700; }
      .rel { stroke: #64748B; stroke-width: 1.6; fill: none; }
      .rel-label { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
      .rel-note { font-family: "Segoe UI", Arial, sans-serif; font-size: 10.5px; fill: #64748B; }
      .legend { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; fill: #334155; }
      .divider { stroke: #E2E8F0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1480" height="960" fill="#F8FAFC"/>

  <text x="60" y="52" class="title">EasyKeep — ER-диаграмма базы данных</text>
  <text x="60" y="78" class="subtitle">Схема dbo · 6 связанных таблиц · SQL Server · PK / FK / UQ / CK · связи 1 : N</text>

  <!-- ================= categories ================= -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="120" width="300" height="100" rx="12" class="card"/>
    <path d="M70 132 A12 12 0 0 1 82 120 H358 A12 12 0 0 1 370 132 V156 H70 Z" class="header"/>
  </g>
  <text x="84" y="143" class="table-name">dbo.categories</text>

  <rect x="82" y="161" width="30" height="16" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="0.8"/>
  <text x="97" y="173" text-anchor="middle" class="badge-text" fill="#92400E">PK</text>
  <text x="120" y="173" class="field">id</text>
  <text x="356" y="173" text-anchor="end" class="type">INT IDENTITY</text>
  <line x1="70" y1="182" x2="370" y2="182" class="divider"/>

  <rect x="82" y="187" width="30" height="16" rx="4" fill="#DCFCE7" stroke="#22C55E" stroke-width="0.8"/>
  <text x="97" y="199" text-anchor="middle" class="badge-text" fill="#166534">UQ</text>
  <text x="120" y="199" class="field">name</text>
  <text x="356" y="199" text-anchor="end" class="type">NVARCHAR(100)</text>

