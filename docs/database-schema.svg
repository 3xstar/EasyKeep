  <line x1="70" y1="496" x2="410" y2="496" class="divider"/>

  <rect x="82" y="501" width="30" height="16" rx="4" fill="#FEE2E2" stroke="#F87171" stroke-width="0.8"/>
  <text x="97" y="513" text-anchor="middle" class="badge-text" fill="#B91C1C">CK</text>
  <text x="120" y="513" class="field">price</text>
  <text x="396" y="513" text-anchor="end" class="type">DECIMAL(18,2)</text>
