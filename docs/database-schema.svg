  <rect x="82" y="527" width="30" height="16" rx="4" fill="#FEE2E2" stroke="#F87171" stroke-width="0.8"/>
  <text x="97" y="539" text-anchor="middle" class="badge-text" fill="#B91C1C">CK</text>
  <text x="120" y="539" class="field">min_stock</text>
  <text x="396" y="539" text-anchor="end" class="type">INT</text>

