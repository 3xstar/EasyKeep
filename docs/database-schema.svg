  <text x="97" y="461" text-anchor="middle" class="badge-text" fill="#1D4ED8">FK</text>
  <text x="120" y="461" class="field">category_id</text>
  <text x="396" y="461" text-anchor="end" class="type">INT</text>
  <line x1="70" y1="470" x2="410" y2="470" class="divider"/>

  <text x="86" y="487" class="field">unit</text>
