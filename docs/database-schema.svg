  <text x="1110" y="173" class="field">id</text>
  <text x="1366" y="173" text-anchor="end" class="type">INT IDENTITY</text>
  <line x1="1060" y1="182" x2="1380" y2="182" class="divider"/>

  <rect x="1072" y="187" width="30" height="16" rx="4" fill="#DCFCE7" stroke="#22C55E" stroke-width="0.8"/>
  <text x="1087" y="199" text-anchor="middle" class="badge-text" fill="#166534">UQ</text>
  <text x="1110" y="199" class="field">name</text>
  <text x="1366" y="199" text-anchor="end" class="type">NVARCHAR(100)</text>
  <line x1="1060" y1="208" x2="1380" y2="208" class="divider"/>

  <text x="1076" y="225" class="field">address</text>
  <text x="1366" y="225" text-anchor="end" class="type">NVARCHAR(300) NULL</text>

